name: Frontend Checks

# Pushes to master are covered by deploy.yml, which calls this workflow
# before deploying, so they aren't listed here to avoid a duplicate run.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check (defaults to the triggering ref)'
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # `npm ci` also fails if package-lock.json is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: https://example.invalid/api/v1
        run: npm run build
